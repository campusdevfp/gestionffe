# Cada empujón a main: se pasan las pruebas, se construye la imagen y se despliega en el VPS.
name: Pruebas y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobaciones de despliegue
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: clave-solo-para-las-pruebas
          DJANGO_ALLOWED_HOSTS: ejemplo.test
      - name: Pruebas
        run: python manage.py test --verbosity 2

  imagen:
    needs: pruebas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Entrar en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    needs: imagen
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Actualizar el VPS por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USUARIO }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PUERTO || 22 }}
          script: |
            set -e
            cd /opt/practicas
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull app
            docker compose up -d
            docker image prune -f
            # Espera a que el contenedor se declare sano antes de dar el despliegue por bueno.
            for i in $(seq 1 30); do
              estado=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q app))
              [ "$estado" = "healthy" ] && echo "Despliegue correcto" && exit 0
              sleep 5
            done
            echo "La aplicación no llegó a estar sana; revisa: docker compose logs app"
            exit 1
