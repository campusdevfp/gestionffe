{% extends "base.html" %}
{% block contenido %}
<h1>{{ titulo }}</h1>
{% if ayuda %}<p class="sub">{{ ayuda }}</p>{% endif %}
{% if empresa %}<p class="sub"><a href="{% if user.es_empresa %}{% url 'empresa:panel' %}{% else %}{% url 'tutor:empresa' empresa.pk %}{% endif %}">Volver a la ficha de {{ empresa }}</a></p>{% endif %}
<form method="post" class="formulario bloque"{% if multipart %} enctype="multipart/form-data"{% endif %}>
  {% csrf_token %}
  {{ form }}
  <button class="btn" type="submit">{{ boton }}</button>
</form>
{% endblock %}
